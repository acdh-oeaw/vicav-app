<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <!-- Easel Back Leg -->
  <line x1="50" y1="76" x2="50" y2="114" stroke="#524e3c" stroke-width="2" stroke-linecap="round" />

  <!-- Easel Front Legs -->
  <line x1="45" y1="78" x2="22" y2="114" stroke="#524e3c" stroke-width="2" stroke-linecap="round" />
  <line x1="55" y1="78" x2="78" y2="114" stroke="#524e3c" stroke-width="2" stroke-linecap="round" />

  <!-- Board Drop Shadow -->
  <rect x="23" y="16" width="58" height="66" rx="4" fill="#69644d" />

  <!-- Main Presentation Board -->
  <rect x="19" y="12" width="58" height="66" rx="4" fill="#f4f1e8" stroke="#524e3c" stroke-width="2" />

  <!-- Top Clamp / Binder -->
