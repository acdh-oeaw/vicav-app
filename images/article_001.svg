<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100%" height="100%">
  <defs>
    <style>
      .bg-paper { fill: #FAF9F5; stroke: #85826D; stroke-width: 4; stroke-linejoin: round; }
      .fold { fill: #FAF9F5; stroke: #85826D; stroke-width: 4; stroke-linejoin: round; }
      .text-line { stroke: #85826D; stroke-width: 4; stroke-linecap: round; }
      .text-short { stroke: #A9A58C; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>
  
  <!-- Main Paper Body -->
  <path class="bg-paper" d="M 15 10 L 70 10 L 85 25 L 85 100 L 15 100 Z" />
  
  <!-- Folded Corner -->
  <path class="fold" d="M 70 10 L 70 25 L 85 25" />
  
  <!-- Text Lines -->
  <!-- Line 1 -->
  <line class="text-short" x1="25" y1="38" x2="38" y2="38" />
  <line class="text-line" x1="46" y1="38" x2="75" y2="38" />
  
  <!-- Line 2 -->
  <line class="text-short" x1="25" y1="50" x2="38" y2="50" />
  <line class="text-line" x1="46" y1="50" x2="75" y2="50" />
  
  <!-- Line 3 -->
  <line class="text-short" x1="25" y1="62" x2="38" y2="62" />
  <line class="text-line" x1="46" y1="62" x2="75" y2="62" />
  
  <!-- Line 4 -->
  <line class="text-short" x1="25" y1="74" x2="38" y2="74" />
  <line class="text-line" x1="46" y1="74" x2="75" y2="74" />
  
  <!-- Line 5 -->
  <line class="text-short" x1="25" y1="86" x2="38" y2="86" />
  <line class="text-line" x1="46" y1="86" x2="75" y2="86" />
</svg>