<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .cover-bg { fill: #A9A58C; stroke: #85826D; stroke-width: 4; stroke-linejoin: round; }
      .page-bg { fill: #FAF9F5; stroke: #85826D; stroke-width: 4; stroke-linejoin: round; }
      .text-main { stroke: #85826D; stroke-width: 3; stroke-linecap: round; }
      .text-sub { stroke: #A9A58C; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <!-- External Cover Backing -->
  <path class="cover-bg" d="M 8 22 C 30 27, 50 20, 50 20 C 50 20, 70 27, 92 22 L 92 82 C 70 87, 50 80, 50 80 C 50 80, 30 87, 8 82 Z" />

  <!-- Left Page -->
  <path class="page-bg" d="M 12 20 C 25 24, 48 19, 48 19 L 48 77 C 48 77, 25 82, 12 78 Z" />
  
  <!-- Right Page -->
  <path class="page-bg" d="M 88 20 C 75 24, 52 19, 52 19 L 52 77 C 52 77, 75 82, 88 78 Z" />

  <!-- Center Spine Line -->
  <line x1="50" y1="20" x2="50" y2="78" stroke="#85826D" stroke-width="3" stroke-linecap="round" />

  <!-- Left Page Text -->
  <line class="text-sub" x1="18" y1="32" x2="26" y2="32" />
  <line class="text-main" x1="31" y1="32" x2="42" y2="32" />
  <line class="text-sub" x1="18" y1="42" x2="26" y2="42" />
  <line class="text-main" x1="31" y1="42" x2="42" y2="42" />
  <line class="text-sub" x1="18" y1="52" x2="26" y2="52" />
  <line class="text-main" x1="31" y1="52" x2="42" y2="52" />
  <line class="text-sub" x1="18" y1="62" x2="26" y2="62" />
  <line class="text-main" x1="31" y1="62" x2="42" y2="62" />

  <!-- Right Page Text -->
  <line class="text-sub" x1="58" y1="32" x2="66" y2="32" />
  <line class="text-main" x1="71" y1="32" x2="82" y2="32" />
  <line class="text-sub" x1="58" y1="42" x2="66" y2="42" />
  <line class="text-main" x1="71" y1="42" x2="82" y2="42" />
  <line class="text-sub" x1="58" y1="52" x2="66" y2="52" />
  <line class="text-main" x1="71" y1="52" x2="82" y2="52" />
  <line class="text-sub" x1="58" y1="62" x2="66" y2="62" />
  <line class="text-main" x1="71" y1="62" x2="82" y2="62" />
</svg>