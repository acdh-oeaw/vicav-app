<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <!-- Book Base / Cover Shadow -->
  <rect x="18" y="14" width="70" height="96" rx="4" fill="#69644d" />

  <!-- White Pages Edge (Top & Right) -->
  <path d="M 24,14 L 84,14 A 4,4 0 0,1 88,18 L 88,102 L 82,102 L 82,20 L 24,20 Z" fill="#f4f1e8" stroke="#524e3c" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Main Front Cover -->
  <rect x="12" y="18" width="70" height="92" rx="4" fill="#a49c7f" stroke="#524e3c" stroke-width="2" />

  <!-- Spine Crease -->
  <line x1="20" y1="18" x2="20" y2="110" stroke="#524e3c" stroke-width="1.5" />

  <!-- Title Plate / Label -->
  <rect x="27" y="28" width="46" height="20" rx="3" fill="#fffee8" stroke="#524e3c" stroke-width="1.5" />

  <!-- Title Text Lines -->
  <line x1="33" y1="34.5" x2="67" y2="34.5" stroke="#524e3c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="38" y1="41.5" x2="62" y2="41.5" stroke="#524e3c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bottom-Left Corner Ornament -->
  <path d="M 14,94 L 14,108 A 2,2 0 0,0 16,110 L 30,110 Q 24,100 14,94 Z" fill="#d9cb9e" stroke="#524e3c" stroke-width="1.5" stroke-linejoin="round" />
</svg>